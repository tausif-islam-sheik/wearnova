services:
  postgres:
    image: postgres:18-alpine
    container_name: wearnova-db
    restart: unless-stopped
    ports:
      - '5437:5432'
    environment:
      POSTGRES_USER: wearnova
      POSTGRES_PASSWORD: wearnova123
      POSTGRES_DB: wearnova
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
